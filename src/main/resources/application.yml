spring:
  application:
    name: evan-ai-audit-assistant
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      # API key is dynamically set by CopilotTokenService when copilot.auth-mode=oauth
      # Set this only when using copilot.auth-mode=env
      api-key: ${OPENAI_API_KEY:placeholder}
      base-url: https://api.githubcopilot.com
      chat:
        options:
          model: gpt-4o
        completions-path: /chat/completions
      embedding:
        options:
          model: copilot-text-embedding-ada-002
        embeddings-path: /embeddings

# GitHub Copilot Authentication Configuration
copilot:
  # Authentication mode: "oauth" for GitHub Copilot OAuth flow (default), "env" for environment variable
  auth-mode: oauth
  github:
    # GitHub OAuth App Client ID for device flow authentication
    # Default is the official VS Code Copilot client ID
    client-id: Iv1.b507a08c87ecfe98
    # Optional: Set OAuth token directly (if already authenticated)
    # oauth-token: ${GITHUB_OAUTH_TOKEN:}
  api:
    # Base URL for GitHub Copilot API
    base-url: https://api.githubcopilot.com
    # GitHub API URL for Copilot token exchange
    token-url: https://api.github.com/copilot_internal/v2/token
    # Copilot integration ID header value
    integration-id: vscode-chat
    # OpenAI organization header value
    openai-organization: github-copilot
    # OpenAI intent header value
    openai-intent: conversation-panel
    # User agent for API requests
    user-agent: evan-ai-audit-assistant/1.0.0
    # Client version header value
    client-version: "1.0.0"
  # Proxy configuration for accessing GitHub API
  proxy:
    # Proxy server host (e.g., proxy.company.com)
    host: ${PROXY_HOST:proxy.company.com}
    # Proxy server port (e.g., 8080)
    port: ${PROXY_PORT:8080}
    # Proxy type: HTTP or SOCKS (default: HTTP)
    type: HTTP

# Audit Assistant Configuration
audit:
  knowledge-base:
    # Path to knowledge base documents (supports classpath: or file: prefix)
    documents:
      - classpath:knowledge-base/audit-guidelines.md
      - classpath:knowledge-base/compliance-rules.md
      - classpath:knowledge-base/security-policies.md
  document:
    # Supported question markers in Word documents
    question-markers:
      - "[Q]"
      - "[Question]"
      - "问题："
      - "Question:"
    answer-markers:
      - "[A]"
      - "[Answer]"
      - "答案："
      - "Answer:"

server:
  port: 8080

logging:
  level:
    org.evan.ai: DEBUG
    org.springframework.ai: INFO
